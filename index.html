<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARカード</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: white;
      color: black;
      padding: 10px;
      font-size: 18px;
      max-width: calc(100vw - 40px);
 border-radius: 8px;
 pointer-events: none;
}

 /* [Codex修正 01] 起動失敗を画面上で判別できる表示を追加 */
#status.error {
 background: #8b0000;
 color: white;
 }
    </style>
</head>

<body>
<!-- [Codex修正 02] 状態変化を読み上げソフトにも通知 -->
43 <div id="status" role="status" aria-live="polite">
 
    AR起動中...
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- カード① -->
    <a-entity mindar-image-target="targetIndex: 0">
<!-- [Codex修正 03] 90度回転で画像が真横を向く状態を解消 -->
      <a-image
        src="./ar-image.png"
        position="0 0 0"
        width="1"
        height="1"
       rotation="0 0 0">
      </a-image>

    </a-entity>


    <!-- カード② -->
    <a-entity mindar-image-target="targetIndex: 1">
      <!-- [Codex修正 03] カード②もターゲット面と平行に表示 -->
      <a-image
        src="./ar-image2.jpg"
        position="0 0 0"
        width="1"
        height="1"
       rotation="0 0 0">
      </a-image>

    </a-entity>

  </a-scene>


  <script>
// [Codex修正 04] 起動・認識・消失・異常を一か所で管理
 const scene = document.querySelector('a-scene');
    const status = document.getElementById('status');
const targets = document.querySelectorAll('[mindar-image-target]');
 const targetNames = ['カード①', 'カード②'];
 const visibleTargets = new Set();
function updateStatus(message, isError = false) {
status.textContent = message;
status.classList.toggle('error', isError);
  }
    scene.addEventListener('arReady', () => {
      updateStatus('カードをカメラに映してください');
    });
scene.addEventListener('arError', () => {
 updateStatus('カメラを起動できません。権限とHTTPS接続を確認してください。', true);
  
    });
targets.forEach((target, index) => {
const targetName = targetNames[index] ?? `カード${index + 1}`;

 target.addEventListener('targetFound', () => {
 visibleTargets.add(index);
 updateStatus(`􀀀 ${targetName}を認識しました！`);
 });

 target.addEventListener('targetLost', () => {
 visibleTargets.delete(index);

if (visibleTargets.size === 0) {
 updateStatus('カードを探しています...');
 return;
 }

 const names = [...visibleTargets].map((targetIndex) =>
 targetNames[targetIndex] ?? `カード${targetIndex + 1}`
 );
 updateStatus(`􀀀 ${names.join('・')}を認識中です`);
 });
  
    });
// targets.mind や画像の読み込み失敗も画面に表示する。
 window.addEventListener('unhandledrejection', (event) => {
 console.error(event.reason);
 updateStatus('ARデータを読み込めません。targets.mindと表示画像を確認してください。', true);
  
    });

  </script>

</body>
</html>
