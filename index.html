<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>わたしのAR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="arjs-loader">
    <div>ARを読み込み中...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-nft
      type="nft"
      url="illustreter"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <a-box
      <a-box
  position="0 0 0"
  scale="2 2 2"
  color="red"
        animation="
          property: rotation;
          to: 0 360 0;
          loop: true;
          dur: 3000
        ">
      </a-box>
<script>
  window.addEventListener('arjs-nft-loaded', function () {
    document.querySelector('.arjs-loader').style.display = 'none';
    console.log('NFTデータの読み込み完了！');
  });

  window.addEventListener('camera-init', function () {
    console.log('カメラ起動完了！');
  });

  window.addEventListener('camera-error', function (e) {
    console.error('カメラエラー:', e);
  });
</script>
    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
