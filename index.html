<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARテスト</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      color: red;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div id="filecheck"
  style="position:fixed;top:80px;left:10px;z-index:99999;
  background:white;color:black;font-size:16px;padding:10px;">
  確認中...
  </div>

  <script>
<script>

window.addEventListener('load', function () {
  document.getElementById('status').textContent =
    'ページ読み込みOK';
});

window.addEventListener('arjs-nft-loaded', function () {
  document.getElementById('status').textContent =
    'NFT読み込み完了！';
});

window.addEventListener('arjs-nft-loaded', function () {
  console.log('NFT LOADED');
});

window.addEventListener('error', function (event) {
  document.getElementById('status').textContent =
    'エラー：' + event.message;
});

</script>

</body>
</html>
