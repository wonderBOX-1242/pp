<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARテスト</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <!-- AR.js Image Tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      color: red;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div id="status">AR起動中...</div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-nft
      type="nft"
      url="./illustreter"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <a-box
        position="0 0 0"
        scale="1 1 1"
        color="purple">
      </a-box>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    window.addEventListener('load', function () {
      document.getElementById('status').textContent =
        'AR起動・NFT読み込み中...';
    });

    window.addEventListener('arjs-nft-loaded', function () {
      document.getElementById('status').textContent =
        'NFT読み込み完了！画像を見せてね';
    });
  </script>

</body>
</html>
