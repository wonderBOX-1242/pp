<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARテスト</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      color: red;
      font-size: 20px;
    }
  </style>
</head>

<body>

<div id="debug"
style="position:fixed;top:80px;left:10px;z-index:99999;
background:white;color:black;font-size:18px;padding:10px;">
NFTチェック開始
</div>

<script>
const debug = document.getElementById('debug');

function msg(text) {
  debug.innerHTML += '<br>' + text;
}

window.addEventListener('load', function () {
  msg('① ページOK');
});

document.querySelector('a-nft').addEventListener('componentinitialized', function () {
  msg('② a-nft OK');
});

document.querySelector('a-nft').addEventListener('loaded', function () {
  msg('③ a-nft loaded');
});

window.addEventListener('arjs-nft-loaded', function () {
  msg('④ NFT読み込み完了');
});

window.addEventListener('error', function (e) {
  msg('ERROR: ' + e.message);
});
</script>

</body>
</html>
