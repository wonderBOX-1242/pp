<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARテスト</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="status">AR起動中...</div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-nft
      type="nft"
      url="illustreter"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      emitevents="true"
      id="myNFT"
    >

      <a-box
        position="0 0 0.5"
        scale="0.5 0.5 0.5"
        color="purple">
      </a-box>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const nft = document.getElementById("myNFT");

    window.addEventListener("camera-init", function () {
      status.textContent = "📷 カメラOK・NFT読み込み中";
    });

    window.addEventListener("arjs-nft-loaded", function () {
      status.textContent = "✅ NFT読み込み完了！画像を見せてね";
    });

    nft.addEventListener("markerFound", function () {
      status.textContent = "🎯 画像を認識した！";
    });

    nft.addEventListener("markerLost", function () {
      status.textContent = "画像を見失いました";
    });

    window.addEventListener("camera-error", function (e) {
      status.textContent = "❌ カメラエラー";
      console.error(e);
    });
  </script>

</body>
</html>
