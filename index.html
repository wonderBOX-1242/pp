<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>A-Frameテスト</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
    }
  </style>
</head>

<body>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: true;"
  >

    <a-nft
      id="myNFT"
      type="nft"
      url="illustreter"
      emitevents="true"
    >
      <a-box
        position="0 0 0"
        scale="1 1 1"
        color="purple">
      </a-box>
    </a-nft>

    <a-camera></a-camera>

  </a-scene>

  <script>
    document.querySelector('#myNFT').addEventListener('arjs-nft-loaded', function () {
      console.log('NFT読み込み完了！');
    });
  </script>

</body>
</html>
