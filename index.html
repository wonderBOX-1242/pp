<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>A-Frameテスト</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
    }
  </style>
</head>

<body>

  <a-scene>
    <a-box
      position="0 1 -3"
      rotation="0 45 45"
      color="purple"
      animation="property: rotation; to: 0 405 45; loop: true; dur: 3000">
    </a-box>

    <a-camera position="0 0 0"></a-camera>
  </a-scene>

</body>
</html>
