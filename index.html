<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARテスト</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

<script
  src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar-nft.js"
  onload="document.getElementById('debug').innerHTML += '<br>AR.js読み込みOK';"
  onerror="document.getElementById('debug').innerHTML += '<br>AR.js読み込み失敗';">
</script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      color: red;
      font-size: 20px;
    }

    #debug {
      position: fixed;
      top: 50px;
      left: 10px;
      z-index: 99999;
      background: white;
      color: black;
      font-size: 18px;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div id="status">
    AR起動中...
  </div>

  <div id="debug">
    NFTチェック開始
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

  <a-nft
  id="myNFT"
  type="nft"
  url="illustreter"
  smooth="true"
  smoothCount="10"
  smoothTolerance="0.01"
  smoothThreshold="5"
  emitevents="true">

  <a-box
    position="0 0 0"
    scale="1 1 1"
    color="purple">
  </a-box>

</a-nft>
</a-nft>
    <a-entity camera></a-entity>

  </a-scene>

  <script>
const nft = document.querySelector('#myNFT');

nft.addEventListener('markerFound', function () {
  msg('🎯 markerFound！！');
});

nft.addEventListener('markerLost', function () {
  msg('❌ markerLost');
});
    const debug = document.getElementById('debug');
    const nft = document.querySelector('#myNFT');

    function msg(text) {
      debug.innerHTML += '<br>' + text;
    }

    window.addEventListener('load', function () {
      msg('① ページOK');

      if (AFRAME.components['nft']) {
        msg('② NFTコンポーネント登録OK');
      } else {
        msg('② NFTコンポーネント登録なし');
      }
    });

    nft.addEventListener('componentinitialized', function () {
      msg('③ a-nft初期化OK');
    });

    nft.addEventListener('loaded', function () {
      msg('④ a-nft loaded');
    });
    nft.addEventListener('markerFound', function () {
  msg('⑤ マーカー認識！！');
});

nft.addEventListener('markerLost', function () {
  msg('⑥ マーカーを見失った');
});

    window.addEventListener('arjs-nft-loaded', function () {
      msg('⑤ NFT読み込み完了！');
Promise.all([
  fetch('./tuki.fset').then(r => 'fset: ' + r.status),
  fetch('./tuki.fset3').then(r => 'fset3: ' + r.status),
  fetch('./tuki.iset').then(r => 'iset: ' + r.status)
]).then(results => {
  results.forEach(msg);
}).catch(err => {
  msg('FETCH ERROR: ' + err);
});
      document.getElementById('status').textContent =
        'NFT読み込み完了！画像を見せてね';
    });

    window.addEventListener('error', function (e) {
      msg('ERROR: ' + e.message);
    });

  </script>

</body>
</html>
