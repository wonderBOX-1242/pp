<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARカード</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;

      background: white;
      color: black;

      padding: 10px;
      font-size: 18px;

      max-width: calc(100vw - 40px);

      border-radius: 8px;

      pointer-events: none;
    }

    #status.error {
      background: #8b0000;
      color: white;
    }
  </style>
</head>

<body>

  <div id="status" role="status" aria-live="polite">
    AR起動中...
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- カード① -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-image
        src="./ar-image.png"
        position="0 0 0"
        width="1"
        height="1"
        rotation="90 0 0">
      </a-image>

    </a-entity>


    <!-- カード② -->
    <a-entity mindar-image-target="targetIndex: 1">

      <a-image
        src="./ar-image2.jpg"
        position="0 0 0"
        width="1"
        height="1"
        rotation="90 0 0">
      </a-image>

    </a-entity>

  </a-scene>


  <script>

    const scene = document.querySelector('a-scene');
    const status = document.getElementById('status');

    const targets =
      document.querySelectorAll('[mindar-image-target]');

    const targetNames = [
      'カード①',
      'カード②'
    ];

    const visibleTargets = new Set();


    function updateStatus(message, isError = false) {

      status.textContent = message;

      status.classList.toggle(
        'error',
        isError
      );

    }


    // AR起動成功
    scene.addEventListener('arReady', () => {

      updateStatus(
        'カードをカメラに映してください'
      );

    });


    // AR起動失敗
    scene.addEventListener('arError', () => {

      updateStatus(
        'カメラを起動できません。カメラの権限とHTTPS接続を確認してください。',
        true
      );

    });


    // カード認識
    targets.forEach((target, index) => {

      const targetName =
        targetNames[index] ??
        `カード${index + 1}`;


      target.addEventListener(
        'targetFound',
        () => {

          visibleTargets.add(index);

          updateStatus(
            `✨ ${targetName}を認識しました！`
          );

        }
      );


      target.addEventListener(
        'targetLost',
        () => {

          visibleTargets.delete(index);


          if (visibleTargets.size === 0) {

            updateStatus(
              'カードを探しています...'
            );

            return;
          }


          const names =
            [...visibleTargets].map(
              (targetIndex) =>
                targetNames[targetIndex] ??
                `カード${targetIndex + 1}`
            );


          updateStatus(
            `✨ ${names.join('・')}を認識中です`
          );

        }
      );

    });


    // ARデータ読み込みエラー
    window.addEventListener(
      'unhandledrejection',
      (event) => {

        console.error(event.reason);

        updateStatus(
          'ARデータを読み込めません。targets.mindと表示画像を確認してください。',
          true
        );

      }
    );

  </script>

</body>
</html>
