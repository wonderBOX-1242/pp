<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARカード</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;

      padding: 12px;
      border-radius: 10px;

      background: rgba(255,255,255,0.92);
      color: #111;

      font-size: 16px;
      text-align: center;

      pointer-events: none;
    }

    #status.error {
      background: rgba(139,0,0,0.95);
      color: white;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      z-index: 10000;

      padding: 16px 30px;

      border: none;
      border-radius: 12px;

      background: white;
      color: black;

      font-size: 18px;
      font-weight: bold;
    }
  </style>

</head>

<body>

  <div id="status">
    ARを準備しています...
  </div>

  <button id="startButton">
    ARを開始する
  </button>

<a-scene
mindar-image="
imageTargetSrc: ./targets.mind;
autoStart: false;
uiLoading: no;
uiScanning: yes;
uiError: yes;
filterMinCF: 0.0001;
filterBeta: 0.001;
"
color-space="sRGB"
renderer="colorManagement: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
embedded

>

```
<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>


<!-- カード① -->

<a-entity mindar-image-target="targetIndex: 0">

  <a-image
    src="./ar-image.png"
    position="0 0 0"
    width="1"
    height="1"
    rotation="0 0 0">
  </a-image>

</a-entity>


<!-- カード② -->

<a-entity mindar-image-target="targetIndex: 1">

  <a-image
    src="./ar-image2.jpg"
    position="0 0 0"
    width="1"
    height="1"
    rotation="0 0 0">
  </a-image>

</a-entity>
```

  </a-scene>

  <script>

    const scene =
      document.querySelector('a-scene');

    const arSystem =
      scene.systems['mindar-image-system'];

    const status =
      document.getElementById('status');

    const startButton =
      document.getElementById('startButton');

    const targets =
      document.querySelectorAll(
        '[mindar-image-target]'
      );

    const targetNames = [
      'カード①',
      'カード②'
    ];

    const visibleTargets =
      new Set();


    function updateStatus(
      message,
      isError = false
    ) {

      status.textContent = message;

      status.classList.toggle(
        'error',
        isError
      );

    }


    /*
     * Startボタン
     */

    startButton.addEventListener(
      'click',
      async () => {

        if (location.protocol !== 'https:') {

          updateStatus(
            'HTTPS接続が必要です。',
            true
          );

          return;
        }


        startButton.style.display =
          'none';

        updateStatus(
          'カメラを起動しています...'
        );


        try {

          await arSystem.start();

        } catch (error) {

          console.error(
            'MindAR start error:',
            error
          );

          updateStatus(
            'カメラを起動できませんでした。ブラウザのカメラ権限を確認してください。',
            true
          );

          startButton.style.display =
            'block';

        }

      }
    );


    /*
     * AR起動成功
     */

    scene.addEventListener(
      'arReady',
      () => {

        updateStatus(
          'カードをカメラに映してください'
        );

      }
    );


    /*
     * AR起動エラー
     */

    scene.addEventListener(
      'arError',
      () => {

        updateStatus(
          'カメラを起動できません。カメラ権限とHTTPS接続を確認してください。',
          true
        );

        startButton.style.display =
          'block';

      }
    );


    /*
     * カード認識
     */

    targets.forEach(
      (target, index) => {

        const targetName =
          targetNames[index] ??
          `カード${index + 1}`;


        target.addEventListener(
          'targetFound',
          () => {

            visibleTargets.add(index);

            updateStatus(
              `✨ ${targetName}を認識しました！`
            );

          }
        );


        target.addEventListener(
          'targetLost',
          () => {

            visibleTargets.delete(index);


            if (visibleTargets.size === 0) {

              updateStatus(
                'カードを探しています...'
              );

              return;
            }


            const names =
              [...visibleTargets].map(
                targetIndex =>
                  targetNames[targetIndex] ??
                  `カード${targetIndex + 1}`
              );


            updateStatus(
              `✨ ${names.join('・')}を認識中です`
            );

          }
        );

      }
    );


    /*
     * ARデータ読み込みエラー
     */

    window.addEventListener(
      'unhandledrejection',
      event => {

        console.error(
          event.reason
        );

        updateStatus(
          'ARデータを読み込めません。targets.mindと画像ファイルを確認してください。',
          true
        );

      }
    );

  </script>

</body>
</html>
