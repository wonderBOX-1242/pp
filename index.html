<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARカード</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: white;
      color: black;
      padding: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div id="status">
    AR起動中...
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- カード① -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-image
        src="./ar-image.png"
        position="0 0 0"
        width="1"
        height="1"
        rotation="90 0 0">
      </a-image>

    </a-entity>


    <!-- カード② -->
    <a-entity mindar-image-target="targetIndex: 1">

      <a-image
        src="./ar-image2.jpg"
        position="0 0 0"
        width="1"
        height="1"
        rotation="0 0 0">
      </a-image>

    </a-entity>

  </a-scene>


  <script>

    const status = document.getElementById('status');

    const targets =
      document.querySelectorAll('[mindar-image-target]');

    targets[0].addEventListener('targetFound', () => {
      status.textContent = '🎯 カード①を認識しました！';
    });

    targets[0].addEventListener('targetLost', () => {
      status.textContent = 'カードを探しています...';
    });

    targets[1].addEventListener('targetFound', () => {
      status.textContent = '🎯 カード②を認識しました！';
    });

    targets[1].addEventListener('targetLost', () => {
      status.textContent = 'カードを探しています...';
    });

  </script>

</body>
</html>
