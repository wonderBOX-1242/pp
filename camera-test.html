<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメラテスト</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 10px;
      right: 10px;
      z-index: 10;

      padding: 12px;
      background: white;
      border-radius: 10px;

      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="message">
    カメラを起動しています...
  </div>

  <video id="camera" autoplay playsinline></video>

  <script>
    const video = document.getElementById("camera");
    const message = document.getElementById("message");

    async function startCamera() {
      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment"
            },
            audio: false
          });

        video.srcObject = stream;

        message.textContent =
          "カメラ起動成功！";

      } catch (error) {

        console.error(error);

        message.textContent =
          "カメラ起動失敗: " + error.name;

      }
    }

    startCamera();
  </script>

</body>
</html>
